# Production Nginx reverse proxy configuration for 剧本工作台 (Next.js 16.4.6 on 127.0.0.1:3199)
# Single-process multi-host isolation:
#   - Main creator site: cryptoayin.cn, www.cryptoayin.cn (blocks /admin and /api/admin with HTTP 404)
#   - Isolated admin site: admin.cryptoayin.cn (rewrites / -> /admin inside proxy.ts)
# Behind Cloudflare Edge: keep individual HTTP requests short (async batch + polling) and disable buffering.

upstream studio_workbench_upstream {
    server 127.0.0.1:3199;
    keepalive 32;
}

# 1. Creator Main Site (cryptoayin.cn / www.cryptoayin.cn)
server {
    listen 80;
    listen [::]:80;
    server_name cryptoayin.cn www.cryptoayin.cn;

    # Optional HTTPS / Certbot block (if terminating TLS on origin instead of HTTP-only behind Cloudflare):
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/cryptoayin.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cryptoayin.cn/privkey.pem;

    # Allow large video uploads (up to 256 MB per file; Cloudflare Free/Pro edge cap is 100 MB per request)
    client_max_body_size 256m;
    client_body_timeout 180s;

    # Stream uploads directly to Next.js without buffering onto Nginx temp disk
    proxy_request_buffering off;
    proxy_buffering off;

    # Defense-in-depth: block admin routes at Nginx layer in addition to Next.js proxy.ts
    location ~* ^/admin(/|$) {
        return 404;
    }

    location ~* ^/api/admin(/|$) {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND"}';
    }

    location / {
        proxy_pass http://studio_workbench_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}

# 2. Isolated Admin Subdomain (admin.cryptoayin.cn)
server {
    listen 80;
    listen [::]:80;
    server_name admin.cryptoayin.cn;

    # Once DNS A record for admin.cryptoayin.cn points to the server, issue & enable TLS via:
    #   certbot --nginx -d admin.cryptoayin.cn
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/admin.cryptoayin.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.cryptoayin.cn/privkey.pem;

    client_max_body_size 256m;
    client_body_timeout 180s;

    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://studio_workbench_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}

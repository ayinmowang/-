<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>总编剧 · 剧本工作台 (STORY STUDIO PRO)</title>
<style>
:root {
  --bg-base: #f5f5f7;
  --bg-elevated: rgba(255, 255, 255, 0.78);
  --bg-card: rgba(255, 255, 255, 0.88);
  --bg-sidebar: rgba(248, 248, 250, 0.84);
  --ink: #1d1d1f;
  --ink-secondary: #515154;
  --muted: #86868b;
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --green: #1d7d52;
  --green-dark: #155e3d;
  --line: rgba(0, 0, 0, 0.08);
  --glass-border: rgba(255, 255, 255, 0.75);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.07), 0 2px 6px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.14), 0 4px 16px rgba(0, 0, 0, 0.06);
  --spring: cubic-bezier(0.22, 1, 0.36, 1);
}
[data-theme="dark"] {
  --bg-base: #0b0c10;
  --bg-elevated: rgba(24, 26, 32, 0.78);
  --bg-card: rgba(30, 32, 40, 0.86);
  --bg-sidebar: rgba(18, 19, 24, 0.88);
  --ink: #f5f5f7;
  --ink-secondary: #a1a1a6;
  --muted: #6e6e73;
  --accent: #2997ff;
  --accent-hover: #47a9ff;
  --green: #30d158;
  --green-dark: #248a3d;
  --line: rgba(255, 255, 255, 0.09);
  --glass-border: rgba(255, 255, 255, 0.12);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 14px 36px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 28px 70px rgba(0, 0, 0, 0.65);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-base);
  background-image:
    radial-gradient(at 18% 8%, rgba(0, 113, 227, 0.09) 0px, transparent 48%),
    radial-gradient(at 82% 14%, rgba(52, 199, 89, 0.08) 0px, transparent 45%),
    radial-gradient(at 52% 92%, rgba(175, 82, 222, 0.06) 0px, transparent 50%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Noto Sans SC', sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: transform 0.24s var(--spring), background 0.2s, border-color 0.2s, box-shadow 0.24s var(--spring), opacity 0.2s; }
button:active:not(:disabled) { transform: scale(0.97); }
button:disabled { opacity: 0.42; cursor: not-allowed; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.hidden { display: none !important; }

@keyframes fadeUpSpring {
  from { opacity: 0; transform: translateY(10px) scale(0.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0, 113, 227, 0.35); }
  50% { box-shadow: 0 0 0 6px rgba(0, 113, 227, 0); }
}

.studio { display: flex; min-height: 100dvh; }

/* Drag & Drop Overlay */
.drop-zone-banner {
  border: 2px dashed var(--accent);
  background: rgba(0, 113, 227, 0.06);
  border-radius: 16px;
  padding: 16px 18px;
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  transition: background 0.2s, transform 0.2s var(--spring);
}
.drop-zone-banner.dragging {
  background: rgba(0, 113, 227, 0.16);
  transform: scale(1.01);
}
.drop-zone-info strong { display: block; font-size: 13px; color: var(--accent); }
.drop-zone-info small { display: block; font-size: 11px; color: var(--ink-secondary); margin-top: 3px; }

/* Apple Vibrancy Sidebar */
.sidebar {
  width: 260px;
  height: 100dvh;
  position: fixed;
  left: 0;
  top: 0;
  background: var(--bg-sidebar);
  backdrop-filter: saturate(190%) blur(28px);
  -webkit-backdrop-filter: saturate(190%) blur(28px);
  border-right: 1px solid var(--line);
  padding: 22px 16px 0;
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand { justify-content: flex-start; gap: 12px; padding: 4px 10px; margin-bottom: 20px; width: 100%; }
.brand-icon {
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #0071e3 0%, #34c759 100%);
  width: 38px;
  height: 38px;
  border-radius: 11px;
  color: #fff;
  font-size: 18px;
  box-shadow: 0 6px 16px rgba(0, 113, 227, 0.28);
}
.brand > span:last-child { text-align: left; font-weight: 700; font-size: 17px; letter-spacing: -0.2px; }
.brand small { display: block; letter-spacing: 1.4px; font-size: 9px; color: var(--muted); font-weight: 600; margin-top: 2px; }

.new-chat {
  justify-content: flex-start;
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 11px 14px;
  background: var(--bg-card);
  box-shadow: var(--shadow-sm);
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
}
.new-chat:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.new-chat > span { margin-left: auto; opacity: 0.5; font-size: 11px; }

.search {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 14px 2px 18px;
  padding: 8px 11px;
  border-radius: 10px;
  background: rgba(120, 120, 128, 0.09);
  color: var(--muted);
}
.search input { background: none; border: 0; width: 100%; font-size: 12px; min-width: 0; outline: none; }
.section-label { padding: 0 10px; display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }

.project-list { flex: 1; overflow-y: auto; padding-top: 10px; min-height: 0; }
.project-item { margin-bottom: 6px; border-radius: 11px; transition: background 0.2s; }
.project-item.selected { background: rgba(0, 113, 227, 0.12); box-shadow: inset 0 0 0 1px rgba(0, 113, 227, 0.25); }
.project-item:hover:not(.selected) { background: rgba(120, 120, 128, 0.08); }
.project-item > button { padding: 10px 11px; gap: 10px; width: 100%; text-align: left; justify-content: flex-start; }
.status-dot { font-size: 11px; line-height: 1; flex-shrink: 0; width: 16px; text-align: center; }
.status-dot.action { color: var(--accent); }
.status-dot.running { color: #ff9f0a; }
.status-dot.idle { color: #34c759; }
.project-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
.project-item small { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 11px; font-weight: 400; color: var(--ink-secondary); }
.project-item i { height: 3px; width: 3px; border-radius: 50%; background: var(--muted); }

.sidebar-bottom { border-top: 1px solid var(--line); padding: 12px 2px 0; display: grid; gap: 4px; }
.sidebar-bottom > button { display: flex; width: 100%; justify-content: flex-start; padding: 9px 10px; color: var(--ink-secondary); font-size: 12px; font-weight: 500; border-radius: 9px; }
.sidebar-bottom > button:hover, .sidebar-bottom > button.active { color: var(--accent); background: rgba(0, 113, 227, 0.09); }
.account { border-top: 1px solid var(--line); padding: 14px 6px; display: flex; gap: 10px; align-items: center; margin-top: 8px; font-size: 12px; font-weight: 600; }
.account small { display: block; color: var(--muted); font-size: 10px; font-weight: 400; margin-top: 2px; }
.avatar { height: 34px; width: 34px; display: grid; place-items: center; background: linear-gradient(135deg, #0071e3, #5e5ce6); color: #fff; border-radius: 50%; font-weight: 700; font-size: 13px; box-shadow: 0 3px 10px rgba(0, 113, 227, 0.25); }
.account button { margin-left: auto; color: var(--ink-secondary); padding: 6px; border-radius: 8px; }

/* Main Area & Apple Segmented Topbar */
.main { margin-left: 260px; flex: 1; min-width: 0; min-height: 100dvh; display: flex; flex-direction: column; transition: margin 0.28s var(--spring); }
.topbar {
  height: 62px;
  flex-shrink: 0;
  padding: 0 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  background: var(--bg-elevated);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  position: sticky;
  top: 0;
  z-index: 15;
}
.breadcrumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-secondary); min-width: 0; white-space: nowrap; overflow: hidden; }
.breadcrumbs strong { color: var(--ink); font-weight: 600; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 220px; }
.bot-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(52, 199, 89, 0.12);
  color: #1d7d52;
  border: 1px solid rgba(52, 199, 89, 0.28);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}
[data-theme="dark"] .bot-status-pill { color: #30d158; }

.segmented-control {
  display: inline-flex;
  background: rgba(120, 120, 128, 0.12);
  padding: 3px;
  border-radius: 11px;
  gap: 3px;
  flex-shrink: 0;
}
.segmented-control button {
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-secondary);
  min-height: 30px;
  white-space: nowrap;
  flex-shrink: 0;
}
.segmented-control button.active {
  background: var(--bg-card);
  color: var(--ink);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.09);
}

.top-actions { display: flex; gap: 9px; align-items: center; }
.connection {
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink);
  background: var(--bg-card);
  box-shadow: var(--shadow-sm);
  min-height: 34px;
  white-space: nowrap;
  flex-shrink: 0;
}
.dot { height: 7px; width: 7px; border-radius: 50%; background: #8e8e93; display: inline-block; }
.dot.green { background: #34c759; box-shadow: 0 0 8px rgba(52, 199, 89, 0.6); }
.icon-button { color: var(--ink-secondary); padding: 7px; border-radius: 9px; background: rgba(120, 120, 128, 0.08); min-width: 36px; min-height: 36px; }
.mobile-menu { display: none; }

/* Apple Cards & Flow Grid */
.flow-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 14px; }
.flow-card {
  display: block;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  border-radius: 15px;
  padding: 12px 13px 10px;
  position: relative;
  min-width: 0;
  box-shadow: var(--shadow-sm);
  transition: transform 0.28s var(--spring), box-shadow 0.28s var(--spring), border-color 0.2s;
}
.flow-card:hover { transform: translateY(-3px) scale(1.01); box-shadow: var(--shadow-md); border-color: rgba(0, 113, 227, 0.35); }
.flow-card.chosen {
  border-color: var(--accent);
  background: linear-gradient(180deg, rgba(0, 113, 227, 0.08) 0%, var(--bg-card) 100%);
  box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.22), var(--shadow-md);
}
.flow-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.flow-icon {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: rgba(0, 113, 227, 0.1);
  display: grid;
  place-items: center;
  font-size: 16px;
}
.selection-circle { height: 18px; width: 18px; border: 1.5px solid var(--muted); border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.chosen .selection-circle { background: var(--accent); color: #fff; border-color: var(--accent); }
.flow-card h3 { font-size: 14px; font-weight: 700; white-space: nowrap; margin: 0 0 5px; color: var(--ink); }
.flow-card p { font-size: 11px; line-height: 1.45; color: var(--ink-secondary); margin: 0; min-height: 28px; }
.flow-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--muted); font-size: 10px; font-weight: 600; }
.chosen .flow-foot { color: var(--accent); }

.suggestions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; font-size: 11px; }
.suggestions > span { color: var(--muted); font-weight: 600; width: 100%; }
.suggestions button {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px;
  background: var(--bg-card);
  color: var(--ink);
  font-size: 11.5px;
  font-weight: 500;
  box-shadow: var(--shadow-sm);
}
.suggestions button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

/* Chat & Messages */
.conversation { width: 100%; max-width: 960px; margin: 0 auto; padding: 14px 30px 44px; flex: 1; animation: fadeUpSpring 0.35s var(--spring); }
.project-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.project-meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.project-type { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent); font-weight: 600; background: rgba(0, 113, 227, 0.1); padding: 4px 10px; border-radius: 999px; }
.stop-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #1d7d52; background: rgba(52, 199, 89, 0.12); padding: 4px 10px; border-radius: 999px; font-weight: 600; }
.lock-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #b25000; background: rgba(255, 159, 10, 0.15); padding: 4px 10px; border-radius: 999px; font-weight: 600; }
.project-heading h1 { font-size: 23px; letter-spacing: -0.3px; font-weight: 700; margin: 8px 0 2px; }
.date-divider { font-size: 11px; color: var(--muted); text-align: center; margin: 16px 0; font-weight: 500; }

.message { display: flex; align-items: flex-start; gap: 12px; margin: 16px 0; animation: fadeUpSpring 0.3s var(--spring); }
.director-avatar {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  background: linear-gradient(135deg, #0071e3 0%, #34c759 100%);
  color: #fff;
  border-radius: 11px;
  font-weight: 700;
  font-size: 14px;
  box-shadow: 0 4px 12px rgba(0, 113, 227, 0.22);
}
.message-body { min-width: 0; max-width: 100%; flex: 1; }
.message-meta { font-weight: 600; font-size: 12px; color: var(--ink); margin: 2px 0 6px; display: flex; gap: 10px; align-items: center; }
.message-meta > span { font-size: 11px; color: var(--muted); font-weight: 400; }
.message-text {
  font-size: 13.5px;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: var(--ink);
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 4px 16px 16px 16px;
  padding: 14px 18px;
  box-shadow: var(--shadow-sm);
}
.suggestion-box {
  margin-top: 10px;
  background: linear-gradient(135deg, rgba(0, 113, 227, 0.06) 0%, rgba(52, 199, 89, 0.06) 100%);
  border: 1px solid rgba(0, 113, 227, 0.18);
  border-radius: 14px;
  padding: 11px 14px;
}
.suggestion-title { display: block; font-size: 11.5px; font-weight: 700; color: var(--accent); margin-bottom: 7px; }
.message.user { justify-content: flex-end; }
.message.user .message-body { max-width: 82%; flex: initial; }
.message.user .message-text {
  background: linear-gradient(135deg, #0071e3 0%, #005bb5 100%);
  border: 0;
  border-radius: 18px 18px 4px 18px;
  padding: 12px 17px;
  color: #fff;
  box-shadow: 0 6px 18px rgba(0, 113, 227, 0.22);
}
.user-time { display: flex; align-items: center; justify-content: flex-end; gap: 5px; font-size: 10px; color: var(--muted); margin-top: 5px; }

/* Apple Glass Decision Cards */
.decision {
  margin: 12px 0 12px 46px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--bg-card);
  backdrop-filter: saturate(180%) blur(24px);
  padding: 16px 18px;
  box-shadow: var(--shadow-md);
  animation: fadeUpSpring 0.35s var(--spring);
}
.inline-bot-card { margin-left: 0; margin-top: 12px; }
.decision-title { display: flex; gap: 11px; align-items: center; font-size: 13.5px; font-weight: 700; color: var(--ink); }
.decision-title > span { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: rgba(0, 113, 227, 0.12); color: var(--accent); font-size: 15px; flex-shrink: 0; }
.decision-title small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.recap-grid { display: grid; grid-template-columns: repeat(3, 1fr); margin: 14px 0; padding: 12px; border-radius: 12px; background: rgba(120, 120, 128, 0.06); gap: 10px; font-size: 11px; color: var(--muted); }
.recap-grid strong { display: block; color: var(--ink); font-weight: 700; font-size: 12.5px; margin-top: 4px; }
.decision-actions { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }

.primary {
  background: linear-gradient(180deg, #0077ed 0%, #0062c4 100%);
  color: #fff;
  font-size: 12.5px;
  font-weight: 600;
  padding: 9px 17px;
  border-radius: 999px;
  box-shadow: 0 4px 14px rgba(0, 113, 227, 0.32);
  min-height: 36px;
}
.primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 113, 227, 0.42); }
.secondary {
  background: var(--bg-card);
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 12px;
  font-weight: 600;
  border-radius: 999px;
  padding: 8px 14px;
  min-height: 34px;
  box-shadow: var(--shadow-sm);
}
.secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.wide { width: 100%; margin-top: 14px; }

/* Dedicated Workspace Status & Live Output View */
.workspace-view {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 20px 30px 36px;
  flex: 1;
  display: grid;
  gap: 18px;
  animation: fadeUpSpring 0.35s var(--spring);
}
.workspace-hud {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px 22px;
  box-shadow: var(--shadow-md);
}
.hud-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.hud-title h2 { margin: 4px 0 0; font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
.agent-pipeline {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}
.agent-node {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 11px;
  background: rgba(120, 120, 128, 0.04);
  transition: transform 0.25s var(--spring), border-color 0.25s;
}
.agent-node.done { border-color: rgba(52, 199, 89, 0.4); background: rgba(52, 199, 89, 0.07); }
.agent-node.active {
  border-color: var(--accent);
  background: rgba(0, 113, 227, 0.09);
  animation: pulseGlow 2.4s infinite;
}
.agent-node-head { display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; font-weight: 700; margin-bottom: 5px; }
.agent-node strong { display: block; font-size: 12px; color: var(--ink); }
.agent-node small { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }

.workspace-grid {
  display: grid;
  grid-template-columns: 1fr 1.35fr;
  gap: 18px;
  align-items: start;
}
.output-viewer {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px 20px;
  box-shadow: var(--shadow-md);
}
.output-tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 11px; margin-bottom: 12px; }
.output-tabs button {
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-secondary);
  background: rgba(120, 120, 128, 0.08);
}
.output-tabs button.active { background: var(--accent); color: #fff; }
.output-document {
  background: rgba(120, 120, 128, 0.05);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 15px 17px;
  font-size: 13px;
  line-height: 1.82;
  white-space: pre-wrap;
  max-height: 430px;
  overflow-y: auto;
}
.video-preview-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(120, 120, 128, 0.05);
  margin-bottom: 8px;
}
.video-preview-card video { width: 110px; height: 64px; object-fit: cover; border-radius: 8px; background: #000; }

/* Admin Console View (/admin) */
.admin-view {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 22px 30px 36px;
  flex: 1;
  display: grid;
  gap: 18px;
  animation: fadeUpSpring 0.35s var(--spring);
}
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 15px 17px;
  box-shadow: var(--shadow-sm);
}
.kpi-card span { font-size: 11px; color: var(--muted); font-weight: 600; }
.kpi-card strong { display: block; font-size: 22px; font-weight: 700; margin: 5px 0 4px; color: var(--ink); }
.kpi-card small { font-size: 11px; color: #1d7d52; font-weight: 600; }
.admin-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.admin-table th, .admin-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.admin-table th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }

/* Composer Area */
.composer-area { position: sticky; bottom: 0; margin-top: auto; padding: 8px 34px 14px; background: linear-gradient(0deg, var(--bg-base) 82%, transparent); width: 100%; z-index: 10; pointer-events: none; }
.composer-area > div { max-width: 900px; margin: 0 auto; pointer-events: auto; }
.composer {
  border: 1px solid var(--line);
  background: var(--bg-card);
  backdrop-filter: saturate(190%) blur(24px);
  box-shadow: var(--shadow-md);
  border-radius: 18px;
  padding: 12px 15px 10px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.composer:focus-within { border-color: var(--accent); box-shadow: 0 8px 28px rgba(0, 113, 227, 0.16); }
.composer textarea { display: block; resize: none; max-height: 140px; width: 100%; border: 0; background: transparent; font-size: 13.5px; line-height: 1.65; min-height: 38px; outline: none; }
.composer-bottom, .composer-bottom > div { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.composer-bottom { justify-content: space-between; margin-top: 6px; }
.attach { color: var(--ink); font-size: 11.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: rgba(0, 113, 227, 0.1); border: 1px solid rgba(0, 113, 227, 0.22); min-height: 32px; }
.attach:hover { background: rgba(0, 113, 227, 0.18); }
.composer-divider { height: 13px; width: 1px; background: var(--line); }
.composer-kind-btn { display: inline-flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--accent); font-weight: 600; padding: 5px 11px; border-radius: 999px; background: rgba(0, 113, 227, 0.08); min-height: 32px; }
.send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3); }
.composer-caption { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 7px !important; padding: 0 6px; }
.queued-files { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 8px; }
.queued-files > span { display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 113, 227, 0.1); color: var(--accent); padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; max-width: 100%; overflow-wrap: anywhere; }

.card-fields { display: grid; gap: 12px; margin: 12px 0; }
.card-fields label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-secondary); }
.card-fields input, .card-fields textarea, .card-fields select { width: 100%; margin-top: 6px; background: var(--bg-base); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; font-weight: 400; }
.episode-row { display: grid; grid-template-columns: 1.4fr 0.8fr auto; gap: 8px; align-items: center; background: rgba(120, 120, 128, 0.05); padding: 9px 12px; border-radius: 11px; border: 1px solid var(--line); }
.preset-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; }
.preset-chip { font-size: 11.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-card); color: var(--ink); min-height: 32px; text-align: left; }
.preset-chip.active, .preset-chip:hover { background: rgba(0, 113, 227, 0.12); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.gate-hint { font-size: 11.5px; color: #b25000; background: rgba(255, 159, 10, 0.12); border: 1px solid rgba(255, 159, 10, 0.3); border-radius: 10px; padding: 9px 12px; margin: 0 0 12px; }

.delivery-block { margin: 14px 0 14px 46px; display: grid; gap: 10px; }
.download-card { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); background: var(--bg-card); border-radius: 16px; padding: 14px 18px; color: var(--ink); box-shadow: var(--shadow-sm); width: 100%; text-align: left; }
.download-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.download-card small { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
.download-card strong { font-size: 13.5px; font-weight: 700; }
.transfer-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: rgba(120, 120, 128, 0.06); border: 1px solid var(--line); border-radius: 14px; padding: 11px 15px; font-size: 11.5px; color: var(--ink-secondary); }
.transfer-bar > div { display: flex; gap: 8px; flex-wrap: wrap; }

/* Right Panel */
.with-panel { margin-right: 290px; }
.right-panel {
  width: 290px;
  position: fixed;
  right: 0;
  top: 0;
  bottom: 0;
  border-left: 1px solid var(--line);
  background: var(--bg-sidebar);
  backdrop-filter: saturate(190%) blur(28px);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  z-index: 20;
}
.panel-title { height: 62px; min-height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--line); font-size: 13.5px; font-weight: 700; }
.panel-tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 16px; gap: 14px; }
.panel-tabs > button { font-size: 11.5px; color: var(--muted); padding: 13px 2px 11px; border-bottom: 2px solid transparent; min-height: 40px; font-weight: 600; }
.panel-tabs > button.active { border-color: var(--accent); color: var(--accent); }
.panel-section { padding: 18px 20px; border-bottom: 1px solid var(--line); }
.panel-label { font-size: 10.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.panel-section h3 { font-size: 13.5px; font-weight: 700; margin: 8px 0; }
.progress-track { height: 6px; border-radius: 999px; background: rgba(120, 120, 128, 0.14); overflow: hidden; margin: 12px 0 8px; }
.progress-track i { height: 100%; background: linear-gradient(90deg, #0071e3, #34c759); display: block; min-width: 5%; border-radius: 999px; transition: width 0.4s var(--spring); }
.timeline { padding-top: 14px; padding-bottom: 14px; }
.timeline > div { display: flex; align-items: center; gap: 11px; position: relative; height: 36px; }
.timeline > div:not(:last-child):after { content: ''; position: absolute; width: 1.5px; height: 22px; top: 24px; left: 7px; background: var(--line); }
.timeline > div > span { height: 16px; width: 16px; border: 1.5px solid var(--muted); border-radius: 50%; display: grid; place-items: center; background: var(--bg-card); color: var(--accent); z-index: 1; font-size: 9px; font-weight: 700; }
.timeline > div.current > span, .timeline > div.done > span { border-color: var(--accent); background: rgba(0, 113, 227, 0.12); }
.timeline p { font-size: 11.5px; color: var(--ink-secondary); margin: 0; }
.timeline .current p, .timeline .done p { color: var(--ink); font-weight: 600; }
.timeline small { font-size: 10px; color: var(--accent); margin-left: auto; background: rgba(0, 113, 227, 0.1); border-radius: 999px; padding: 2px 8px; font-weight: 600; }
.panel-section dl { display: grid; grid-template-columns: 1fr 1.2fr; font-size: 11.5px; row-gap: 11px; margin: 14px 0 0; }
.panel-section dt { color: var(--muted); }
.panel-section dd { margin: 0; text-align: right; color: var(--ink); font-weight: 600; }
.panel-bottom { margin-top: auto; padding: 16px 20px; display: flex; gap: 8px; color: var(--muted); font-size: 11px; }
.file-item { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 6px; }
.file-row { display: flex; gap: 10px; align-items: center; padding: 8px 0 4px; font-size: 11.5px; }
.file-row > span { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.file-row small { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; font-weight: 400; }
.requirement { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; padding: 11px 13px; }
.requirement > span { display: flex; align-items: center; gap: 5px; color: var(--accent); font-size: 10px; font-weight: 700; }
.requirement p { font-size: 11.5px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; margin: 5px 0 0; }

/* Apple Sheet / Spotlight Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.36);
  backdrop-filter: saturate(180%) blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeUpSpring 0.25s var(--spring);
}
.modal {
  width: 540px;
  max-width: 100%;
  max-height: 90dvh;
  overflow: auto;
  background: var(--bg-card);
  backdrop-filter: saturate(200%) blur(32px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 26px;
  position: relative;
  box-shadow: var(--shadow-lg);
  animation: fadeUpSpring 0.32s var(--spring);
}
.modal-close { position: absolute; right: 16px; top: 16px; padding: 4px; color: var(--muted); border-radius: 50%; background: rgba(120, 120, 128, 0.1); min-width: 34px; min-height: 34px; }
.modal h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; margin: 6px 0; }
.modal > p { font-size: 12.5px; color: var(--ink-secondary); line-height: 1.65; margin-bottom: 14px; }
.modal > label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-secondary); margin-top: 12px; }
.modal input { display: block; width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-base); margin-top: 6px; font-size: 13px; }
.modal-flow-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
.modal-flow-card {
  text-align: left;
  padding: 12px 13px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: var(--bg-base);
  display: block;
}
.modal-flow-card.active {
  border-color: var(--accent);
  background: rgba(0, 113, 227, 0.09);
  box-shadow: 0 4px 16px rgba(0, 113, 227, 0.15);
}
.modal-flow-card strong { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink); }
.modal-flow-card small { display: block; font-size: 11px; color: var(--ink-secondary); margin-top: 4px; line-height: 1.4; }

.error-banner { display: flex; gap: 10px; align-items: center; margin: 12px 34px 0; padding: 11px 15px; border-radius: 12px; background: rgba(255, 59, 48, 0.1); border: 1px solid rgba(255, 59, 48, 0.25); color: #d70015; font-size: 12px; font-weight: 500; }
.error-banner > span { flex: 1; }
.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 150; display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: rgba(29, 29, 31, 0.92); backdrop-filter: blur(16px); color: #fff; border-radius: 999px; box-shadow: var(--shadow-lg); font-size: 12.5px; font-weight: 600; animation: fadeUpSpring 0.25s var(--spring); }

@media(max-width:1280px) { .bot-status-pill { display: none; } }
@media(max-width:1100px) {
  .agent-pipeline { grid-template-columns: repeat(3, 1fr); }
  .workspace-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
}
@media(max-width:1000px) {
  .with-panel { margin-right: 0; }
  .flow-grid { grid-template-columns: repeat(2, 1fr); gap: 9px; }
}
@media(max-width:700px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.26s var(--spring); width: 260px; z-index: 60; }
  .sidebar.open { transform: translateX(0); }
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 45; backdrop-filter: blur(4px); }
  .main { margin-left: 0; }
  .mobile-menu { display: flex; padding: 4px; min-width: 36px; min-height: 36px; }
  .topbar { height: 56px; padding-inline: 12px; }
  .segmented-control button { padding: 5px 8px; font-size: 11px; }
  .conversation, .workspace-view, .admin-view { padding: 14px 12px 20px; }
  .decision, .delivery-block { margin-left: 0; padding: 15px; }
  .composer-area { padding: 6px 12px 10px; }
  .agent-pipeline { grid-template-columns: repeat(2, 1fr); }
  .episode-row { grid-template-columns: 1fr; }
  .right-panel { top: auto; bottom: 0; left: 0; width: 100%; height: 75dvh; border-radius: 22px 22px 0 0; z-index: 50; box-shadow: var(--shadow-lg); }
}
@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

/* Strictly Step-by-Step (一项项来) Progressive Wizard Styles */
.step-wizard-stack {
  display: grid;
  gap: 10px;
  margin-top: 8px;
}
.completed-steps-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 4px;
}
.completed-step-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 13px;
  border-radius: 999px;
  background: rgba(50, 215, 75, 0.10);
  border: 1px solid rgba(50, 215, 75, 0.28);
  color: var(--ink);
  font-size: 12px;
  line-height: 1.3;
  cursor: pointer;
  transition: all 0.18s ease;
}
.completed-step-pill:hover {
  background: rgba(50, 215, 75, 0.18);
  transform: translateY(-1px);
}
.completed-step-pill .pill-check {
  color: var(--ok);
  font-weight: 700;
}
.completed-step-pill .pill-edit {
  color: var(--accent);
  font-weight: 600;
  margin-left: 2px;
}
.step-progress-dots {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  font-size: 12px;
  color: var(--muted);
}
.step-dot {
  width: 22px;
  height: 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  transition: all 0.22s ease;
}
.app-shell[data-theme="light"] .step-dot {
  background: rgba(0, 0, 0, 0.10);
}
.step-dot.done {
  background: var(--ok);
}
.step-dot.active {
  width: 36px;
  background: var(--accent);
}


/* Minimalist Empty-Start Chat + Typing Indicator + Typewriter Caret + Spring Card Reveal */
.conversation.minimal-chat {
  max-width: 760px;
  margin: 0 auto;
  padding: 28px 20px 150px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.minimal-top-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(120, 120, 128, 0.08);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}
.minimal-top-strip strong {
  color: var(--ink);
  font-weight: 600;
}
.minimal-top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}
.minimal-top-actions button {
  min-height: 28px;
  padding: 4px 10px;
  font-size: 11px;
  border-radius: 999px;
}
.typing-bubble {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  border-radius: 18px;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  cursor: pointer;
  animation: fadeSlideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1);
}
.typing-dots {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.typing-dots i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  display: inline-block;
  animation: typingBounce 1.2s infinite ease-in-out;
}
.typing-dots i:nth-child(2) {
  animation-delay: 0.18s;
}
.typing-dots i:nth-child(3) {
  animation-delay: 0.36s;
}
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
  30% { transform: translateY(-5px); opacity: 1; }
}
.typing-status-label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.streaming-caret {
  display: inline-block;
  width: 8px;
  height: 15px;
  margin-left: 3px;
  vertical-align: -2px;
  background: var(--accent);
  border-radius: 2px;
  animation: caretBlink 0.7s infinite;
}
@keyframes caretBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.15; }
}
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(10px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.decision.card-enter {
  animation: fadeSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}

function detectEpisodeFromName(name) {
  const base = name.replace(/\.[^.]+$/, '').trim();
  if (/^\d+\s*[-_]\s*\d+$/.test(base) || /微信视频|WeChat|\d{6,}/i.test(base)) {
    return undefined;
  }
  const match =
    base.match(/(?:第|^|[_\-\s])0*(\d{1,3})\s*集/) ||
    base.match(/(?:^|[_\-\s])(?:ep|episode)\s*0*(\d{1,3})(?:$|[_\-\s])/i) ||
    base.match(/[_-]0*(\d{1,3})$/) ||
    base.match(/^0*(\d{1,3})$/);
  const n = Number(match?.[1]);
  return Number.isInteger(n) && n >= 1 && n <= 300 ? n : undefined;
}

function formatBytes(n) {
  return n > 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
}

function finishStreamingImmediately() {

  list.forEach(m => {
    if (m.fullText && m.text !== m.fullText) {

  });

  state.cardReady = true;
  if (_pendingStreamDone) {

    fn();

}


async function requestRealModelOrBackend(userPrompt, systemRolePrompt) {
  const cfg = state.apiConfig;
  if (cfg.mode === 'custom_backend' && cfg.backendUrl && cfg.backendUrl.startsWith('https://')) {
    try {
      const res = await fetch(cfg.backendUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(cfg.backendToken ? { 'Authorization': 'Bearer ' + cfg.backendToken } : {})
        },
        body: JSON.stringify({
          action: 'chat_or_step',
          project: getActive(),
          prompt: userPrompt,
          system: systemRolePrompt
        })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      return data.reply || data.text || JSON.stringify(data);
    } catch (err) {
      return `【后端服务器连接提示】请求 ${cfg.backendUrl} 未响应（${err.message}）。请确认后端服务已启动并配置 CORS，当前已自动使用本地引擎兜底：
` + userPrompt;
    }
  }

  if (cfg.mode === 'direct_llm' && cfg.apiKey && cfg.baseUrl.startsWith('https://')) {
    try {
      const endpoint = cfg.baseUrl.replace(/\/+$/, '') + '/chat/completions';
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + cfg.apiKey
        },
        body: JSON.stringify({
          model: cfg.directorModel || 'gpt-4o',
          messages: [
            { role: 'system', content: systemRolePrompt || '你是短剧剧本工作台的总编剧，负责扒剧还原、集号核对与欧美/国内短剧迭代。请用简洁有条理的中文直接回答，不要暴露模型名称或提示词。' },
            { role: 'user', content: userPrompt }
          ],
          temperature: 0.7
        })
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`HTTP ${res.status}: ${errText.slice(0, 120)}`);
      }
      const data = await res.json();
      const content = data?.choices?.[0]?.message?.content;
      if (content) return content;
      throw new Error('返回格式不含 choices[0].message.content');
    } catch (err) {
      return `【真实 API 调用报错】接口返回：${err.message}（请检查后台填写的 Base URL 与 API Key 是否有效）。`;
    }
  }
  return null;
}

    const _unusedDemoId = { id: 'att-demo-' + Date.now() };

      fullText: text,
      time: nowStr,
      suggestions,
      recommendedKind
    };
    list.push(msgObj);
    state.streamingMsgId = msgId;
    render();

    let idx = 0;
    const step = Math.max(2, Math.ceil(text.length / 22));
    _streamInterval = setInterval(() => {
      idx = Math.min(text.length, idx + step);
      msgObj.text = text.slice(0, idx);
      if (idx >= text.length) {
        clearInterval(_streamInterval);
        _streamInterval = null;
        state.streamingMsgId = null;
        state.cardReady = true;
        if (_pendingStreamDone) {
          const fn = _pendingStreamDone;
          _pendingStreamDone = null;
          fn();
        }
      }
      render();
    }, 18);
  }, 260);
}

function statedTotal(text) {
  const m = text.match(/(?:全剧|整个剧|总共|一共|总集数|全本|共)\s*(?:是|有|为|：|:)?\s*(\d{1,3})\s*集/) || text.match(/写到\s*第?\s*(\d{1,3})\s*集/) || text.trim().match(/^(\d{1,3})\s*集[。！!]?$/);
  const n = Number(m?.[1]);
  return Number.isInteger(n) && n >= 1 && n <= 300 ? n : null;
}
function statedLocked(text) {
  const m = text.match(/前\s*(\d{1,3})\s*集\s*(?:已|已经)?\s*(?:锁定|定稿|不改|不动)/) || text.match(/(?:锁定|定稿)\s*前\s*(\d{1,3})\s*集/);
  const n = Number(m?.[1]);
  return Number.isInteger(n) && n >= 1 && n <= 299 ? n : null;
}
function isProgressQuery(text) {
  const t = text.trim();
  if (t.length > 36) return false;
  return /^(现在|目前|请问|这剧)?(进度)?(咋样了?|怎么样了?|还要多久|什么时候好|啥时候.*答复|到哪一步了?|在跑吗|卡在哪了?|进度)[？?。！!]*$/.test(t);
}
function inferKind(text) {
  if (/扒剧|视频|字幕|导出表/.test(text)) return 'transcribe';
  if (/国内|红果|出海|三道门|本土化|北美|彩礼/.test(text)) return 'domestic';
  if (/前\s*\d+\s*集|锁定|定稿|续写|原稿|迭代/.test(text)) return 'foreign';
  return 'original';
}

}

// Real File Upload Handler (reads real local video duration & text content!)
function handleFilesSelected(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  state.error = '';
  let active = getActive();

  // If on home page without an active project, auto-switch or queue into transcribe if video/table
  if (!active) {
    const inferred = state.kind || 'transcribe';
    state.kind = inferred;
    const newProj = {
      id: 'proj-' + Date.now(),
      title: files[0].name.replace(/\.[^.]+$/, '') + '（扒剧项目）',
      kind: inferred,
      total: 45,
      lockedEpisodes: null,
      startEpisode: 1,
      confirmed: false,
      transcribeMode: '',
      transcribePhase: 0,
      castLock: '男主：凯尔（Kale Norton）｜女主：南希（Nancy Percy）｜反派：丽莎（Lisa）',
      manualGapText: '凯尔亮出全球仅三张的黑金无限额副卡，店长当场鞠躬核验通过',
      stepIndex: 0,
      activeOutputTab: 'recap',
      createdAt: new Date().toISOString(),
      attachments: [],
      requirements: [`[上传建档] 上传了 ${files.length} 份本地素材`],
      outputs: {},
      messages: [],
      card: null
    };
    state.projects.unshift(newProj);
    state.activeId = newProj.id;
    active = newProj;
  }

  const recognized = [];
  const unrecognized = [];

  files.forEach((f) => {
    let ep = active.kind === 'transcribe' ? detectEpisodeFromName(f.name) : undefined;
    if (ep !== undefined && active.attachments.some(a => a.episode === ep)) {
      ep = undefined; // prevent duplicate auto-assignment
    }
    const attId = 'att-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
    const previewUrl = (f.type && f.type.startsWith('video/')) || /\.(mp4|mov|webm|mkv)$/i.test(f.name)
      ? URL.createObjectURL(f)
      : undefined;

    const att = {
      id: attId,
      name: f.name,
      size: f.size || 4820000,
      type: f.type || 'application/octet-stream',
      role: 'source',
      episode: ep,
      durationSec: 68,
      previewUrl,
      extractedText: ''
    };
    active.attachments.push(att);

    if (ep !== undefined) recognized.push(`${f.name} → 第 ${ep} 集`);
    else unrecognized.push(f.name);

    // If text/subtitle/csv/md file, read real content via FileReader
    if (/\.(txt|md|csv|srt|json)$/i.test(f.name) || (f.type && f.type.startsWith('text/'))) {
      const reader = new FileReader();
      reader.onload = () => {
        att.extractedText = String(reader.result || '').slice(0, 1000);
        active.outputs = generateTranscribeOutputs(active);
        render();
      };
      reader.readAsText(f);
    }

    // If video file, read real duration via temporary HTMLVideoElement
    if (previewUrl) {
      const v = document.createElement('video');
      v.preload = 'metadata';
      v.onloadedmetadata = () => {
        if (v.duration && isFinite(v.duration)) {
          att.durationSec = Math.max(1, Math.round(v.duration));
          active.outputs = generateTranscribeOutputs(active);
          render();
        }
      };
      v.src = previewUrl;
    }
  });

  active.outputs = generateTranscribeOutputs(active);

  const msgParts = [
    `已成功接收你上传的 ${files.length} 份素材！`,
    recognized.length ? `• 自动识别集号：${recognized.join('、')}` : '',
    unrecognized.length ? `• 待补录集号：${unrecognized.join('、')}（文件名未指明唯一集号，请在下方卡片手动填写第几集）` : '• 所有素材集号已识别完毕，请在下方选择「快速模式」或「详细模式」后启动扒剧！'
  ].filter(Boolean);

  active.transcribePhase = unrecognized.length ? 0 : (active.transcribeMode ? 2 : 1);
  active.stepIndex = active.transcribePhase;
  active.messages.push({
    id: 'm-up-' + Date.now(),
    role: 'user',
    text: `📎 已上传 ${files.length} 份素材：${files.map(f => f.name).join('、')}`,
    time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
  });
  playDirectorTurn({
    text: msgParts.join('\n'),
    statusLabel: '总编剧正在看片核对集号与时长…'
  });
}

function downloadTextFile(filename, content) {
  const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 200);
  showToast(`已导出并下载：${filename}`);
}

window.addEventListener('resize', () => {
  // keep right panel user-controlled so chat stays uncluttered
  render();
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.modal) { state.modal = ''; render(); }
    else if (state.left) { state.left = false; render(); }
    else if (window.innerWidth <= 700 && state.right) { state.right = false; render(); }
  }
});

// Global drag and drop support so dropping files anywhere on the webpage works!
window.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (!state.isDragging) {
    state.isDragging = true;
    render();
  }
});
window.addEventListener('dragleave', (e) => {
  if (e.relatedTarget === null) {
    state.isDragging = false;
    render();
  }
});
window.addEventListener('drop', (e) => {
  e.preventDefault();
  state.isDragging = false;
  if (e.dataTransfer?.files?.length) {
    handleFilesSelected(e.dataTransfer.files);
  } else {
    render();
  }
});

function bindEvents() {
  const active = getActive();

  // Bind the hidden real file input once
  const realFileInput = document.getElementById('real-file-input');
  if (realFileInput && !realFileInput._bound) {
    realFileInput._bound = true;
    realFileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleFilesSelected(e.target.files);
        e.target.value = '';
      }
    });
  }

  // Bind all upload buttons to trigger the real file picker!
  ['btn-attach', 'btn-hero-upload', 'btn-top-upload', 'btn-banner-upload', 'btn-ws-upload', 'btn-panel-upload'].forEach(id => {
    document.getElementById(id)?.addEventListener('click', triggerFilePicker);
  });

  // Bind demo video batch loader buttons
  ['btn-hero-demo', 'btn-top-demo', 'btn-banner-demo', 'btn-composer-demo'].forEach(id => {
    document.getElementById(id)?.addEventListener('click', loadDemoVideoBatch);
  });

  document.getElementById('scrim-overlay')?.addEventListener('click', () => {
    state.left = false;
    if (window.innerWidth <= 700) state.right = false;
    render();
  });
  document.getElementById('btn-home')?.addEventListener('click', () => { state.activeId = null; state.surface = 'chat'; state.left = false; render(); });
  document.getElementById('btn-new-chat')?.addEventListener('click', () => { state.activeId = null; state.surface = 'chat'; state.preChat = []; state.pendingBrief = ''; state.left = false; render(); });
  document.getElementById('btn-mobile-menu')?.addEventListener('click', () => { state.left = true; render(); });
  document.getElementById('btn-toggle-right')?.addEventListener('click', () => { state.right = !state.right; render(); });

function saveEpisodeById(attId) {
  const active = getActive();
  if (!active || !attId) return;
  const inputEl = document.getElementById('ep-' + attId);
  const rawVal = state.episodeInputs[attId] !== undefined ? state.episodeInputs[attId] : inputEl?.value;
  const val = Number(rawVal);
  if (!Number.isInteger(val) || val < 1 || val > (active.total || 300)) {
    state.error = `请输入有效集号（1-${active.total || 300}）。`;
    render();
    return;
  }
  if (active.attachments.some(a => a.id !== attId && a.episode === val)) {
    state.error = `第 ${val} 集已有其他素材占用，请核对后填其他集号。`;
    render();
    return;
  }
  const att = active.attachments.find(a => a.id === attId);
  if (att) att.episode = val;
  state.editingEpId = null;
  state.error = '';
  active.outputs = generateTranscribeOutputs(active);
  active.messages.push({ id: 'm-' + Date.now(), role: 'director', text: `已将「${att.name}」标为第 ${val} 集。`, time: '14:18' });
  const stillMissing = active.attachments.some(a => !a.episode);
  showToast(stillMissing ? `第 ${val} 集已保存，请继续补完剩余素材` : `第 ${val} 集已保存！全部集号已对齐，请点击进入下一项`);
}

function transferKind(targetKind) {
  const active = getActive();
  if (!active) return;
  const sugs = buildSuggestions(targetKind, active.title, active.total, null);
  const newProj = {
    id: 'proj-' + Date.now(),
    title: `${active.title}（${labels[targetKind]}）`,
    kind: targetKind,
    total: active.total,
    lockedEpisodes: null,
    startEpisode: 1,
    confirmed: true,
    stepIndex: 1,
    activeOutputTab: 'recap',
    createdAt: new Date().toISOString(),
    attachments: active.attachments.map(a => ({ ...a, role: 'source' })),
    requirements: [`[扒剧转入] 复用扒剧项目「${active.title}」的 ${active.attachments.length} 份素材与还原剧本`],
    outputs: {
      recap: `【由扒剧项目转入${labels[targetKind]}】\n已自动挂载 ${active.attachments.length} 份扒剧还原底稿，准备执行原稿五问${targetKind === 'domestic' ? '与桥段出海四级诊断' : '与情绪曲线分析'}。`,
      analysis: active.outputs?.analysis || '',
      outline: active.outputs?.outline || '',
      script: active.outputs?.script || ''
    },
    messages: [
      {
        id: 'm-' + Date.now(),
        role: 'director',
        text: `已根据你的选择，将扒剧项目转入「${labels[targetKind]}」，并完整复用了刚才扒出的简体全集底稿与 ${active.attachments.length} 份素材。\n\n【总编剧初步建议】\n${sugs.map(s => '• ' + s).join('\n')}`,
        time: '14:20',
        suggestions: sugs
      }
    ],
    card: null
  };
  state.projects.unshift(newProj);
  state.activeId = newProj.id;
  state.surface = 'workspace';
  showToast(`已转入「${labels[targetKind]}」工作页面`);
}

function handleSend() {
  const active = getActive();
  if (!state.text.trim()) return;
  const clean = state.text.trim();

  if (!active) {
    const nextBrief = state.pendingBrief ? state.pendingBrief + '\n' + clean : clean;
    state.pendingBrief = nextBrief;
    const inferred = state.kind || inferKind(nextBrief);
    state.kind = inferred;
    if (!state.title.trim()) {
      state.title = clean.split(/[，。！？\n]/)[0].slice(0, 18);
    }
    const sugs = buildSuggestions(inferred, nextBrief, statedTotal(nextBrief), statedLocked(nextBrief));
    state.preChat.push(
      { id: 'u-' + Date.now(), role: 'user', text: clean, time: '14:22' },
      {
        id: 'd-' + Date.now(),
        role: 'director',
        text: `我先按总编剧视角把你的意思复述一遍，并给你提几条切入建议：\n1. 推荐流程：「★ ${labels[inferred]}」\n2. 集数与范围：${statedTotal(nextBrief) ? '全剧 ' + statedTotal(nextBrief) + ' 集' : '停点 A 拍板'}${statedLocked(nextBrief) ? `（前 ${statedLocked(nextBrief)} 集锁定一字不动，从第 ${statedLocked(nextBrief) + 1} 集续写）` : ''}\n3. 核心要点：“${clean}”`,
        time: '14:22',
        recommendedKind: inferred,
        suggestions: sugs
      }
    );
    state.text = '';
    render();
    return;
  }

  active.messages.push({ id: 'u-' + Date.now(), role: 'user', text: clean, time: '14:22' });
  state.text = '';

  // Recognize transcribe mode via chat text
  if (active.kind === 'transcribe' && /(快速模式|详细模式|^快速$|^详细$)/.test(clean)) {
    active.transcribeMode = clean.includes('详细') ? 'detailed' : 'fast';
    active.outputs = generateTranscribeOutputs(active);
    active.messages.push({
      id: 'd-' + Date.now(),
      role: 'director',
      text: `收到！已将本剧扒剧模式设为「${active.transcribeMode === 'detailed' ? '详细模式（每秒一帧逐格看写）' : '快速模式（按整集看写并抽查）'}」，右侧输出已同步更新。`,
      time: '14:22'
    });
    render();
    return;
  }

  if (isProgressQuery(clean)) {
    active.messages.push({
      id: 'd-' + Date.now(),
      role: 'director',
      text: `当前正处在「${timelineByKind[active.kind][active.stepIndex || 0]}」阶段（已挂载 ${active.attachments.length} 份素材），你可以点顶部「⚡ 实时工作台与输出」直接看 6 大工位状态与实时繁简剧本产出；当前暂无可靠预计时间（不编造交付时间）。`,
      time: '14:22'
    });
  } else {
    const total = statedTotal(clean);
    const locked = statedLocked(clean);
    if (total) active.total = total;
    if (locked) { active.lockedEpisodes = locked; active.startEpisode = locked + 1; }
    active.requirements.push(`[补充要求 · 下一可更新节点生效] ${clean}`);
    if (active.kind === 'transcribe') active.outputs = generateTranscribeOutputs(active);
    const sugs = buildSuggestions(active.kind, clean, active.total, active.lockedEpisodes);
    if ((state.apiConfig.mode === 'direct_llm' && state.apiConfig.apiKey) || (state.apiConfig.mode === 'custom_backend' && state.apiConfig.backendUrl)) {
      state.isTyping = true;
      state.typingStatus = `正在请求真实模型接口 (${state.apiConfig.mode === 'direct_llm' ? state.apiConfig.directorModel : '生产后端'})…`;
      state.cardReady = false;
      render();
      const contextFiles = active.attachments.map(a => `${a.name}(第${a.episode || '?'}集, ${a.durationSec || 68}秒)`).join('、');
      requestRealModelOrBackend(
        `当前项目：《${active.title}》（流程：${labels[active.kind]}，已传素材：${contextFiles || '无'}）。用户刚刚说：${clean}`,
        `你是短剧工作台的总编剧。请针对用户的要求给出具体的短剧改编/扒剧执行回复与2条专业建议。`
      ).then(realReply => {
        playDirectorTurn({
          text: realReply || `记下了，已写入「要求台账」。`,
          statusLabel: '正在流式输出真实模型回复…',
          suggestions: sugs
        });
      });
      return;
    }
    playDirectorTurn({
      text: `记下了，已写入「要求台账」${locked ? `（前 ${locked} 集锁定，从第 ${locked + 1} 集续写）` : ''}。结合你刚说的「${clean.slice(0, 22)}」，我整理了两条建议供你点选：`,
      statusLabel: '总编剧正在思考与整理建议…',
      suggestions: sugs
    });
    return;
  }
}

function handleCreateProject() {
  const k = state.kind || 'transcribe';
  const rawBrief = state.pendingBrief || state.text;
  const projTitle = state.title.trim() || (rawBrief ? rawBrief.split(/[，。！？\n]/)[0].slice(0, 18) : `${labels[k]}新项目`);
  const total = statedTotal(rawBrief) || (k === 'transcribe' ? 45 : null);
  const locked = statedLocked(rawBrief);
  const sugs = buildSuggestions(k, rawBrief, total, locked);
  const newProj = {
    id: 'proj-' + Date.now(),
    title: projTitle,
    kind: k,
    total,
    lockedEpisodes: locked,
    startEpisode: locked ? locked + 1 : 1,
    confirmed: k !== 'transcribe',
    transcribeMode: '',
    castLock: '男主：凯尔（Kale Norton）｜女主：南希（Nancy Percy）｜反派：丽莎（Lisa）',
    manualGapText: '凯尔亮出全球仅三张的黑金无限额副卡，店长当场鞠躬核验通过',
    stepIndex: k === 'transcribe' ? 0 : 1,
    activeOutputTab: 'recap',
    createdAt: new Date().toISOString(),
    attachments: [],
    requirements: rawBrief ? [`[初始说明] ${rawBrief}`] : [`[初始说明] 建立「${labels[k]}」项目`],
    outputs: {},
    messages: [
      ...(rawBrief ? [{ id: 'u-' + Date.now(), role: 'user', text: rawBrief, time: '14:25' }] : []),
      {
        id: 'd-' + Date.now(),
        role: 'director',
        text: k === 'transcribe'
          ? `已建立扒剧项目「${projTitle}」！请点击上方「📎 点击选择本地文件上传」（或直接把视频拖进页面），也可点击「🎬 一键载入 3 集测试视频包」立即体验补集号、选模式与导出繁简双版剧本。`
          : `收到！已为你建立「${projTitle}」（${labels[k]}），并自动打开「⚡ 实时工作台与输出」页面。`,
        time: '14:25',
        suggestions: sugs
      }
    ],
    card: null
  };
  newProj.outputs = k === 'transcribe' ? generateTranscribeOutputs(newProj) : {
    recap: `【${projTitle} · 总编剧复述与立项确认单】\n• 选定流程：${labels[k]}`,
    analysis: `【${projTitle} · 第一阶段实时输出】\n• 核心冲突线与人物关系张力已建档。`
  };
  state.projects.unshift(newProj);
  state.activeId = newProj.id;
  state.modal = '';
  state.surface = k === 'transcribe' ? 'chat' : 'workspace';
  state.text = '';
  state.title = '';
  state.pendingBrief = '';
  state.preChat = [];
  showToast(k === 'transcribe' ? '扒剧项目已就绪，请上传视频或载入测试包' : '已建立项目并进入实时工作页面');
}


try {
  const savedCfg = localStorage.getItem('story_studio_api_config');
  if (savedCfg) {
    Object.assign(state.apiConfig, JSON.parse(savedCfg));
  }
} catch (_) {}
if (window.location.hash === '#admin') {
  state.surface = 'admin';
}

// Boot with a clean empty page, showing the live typing indicator first, then streaming the opening line, then revealing Step 0 card!
playDirectorTurn({
  text: '嗨！页面已清空，我们先跑「扒剧」流程，所有步骤都会一项项出现。第一步，请先上传你的分集视频或导出表（也可以点下方按钮载入测试视频）：',
  statusLabel: '总编剧正在输入…'
});
</script>
